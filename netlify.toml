# Netlify: the site is pre-built into ./site by `python3 build.py`; Netlify just publishes it.
[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# old Squarespace addresses → new pages
[[redirects]]
  from = "/saturn-screenshots"
  to = "/screenshots/saturn/"
