<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=375">
<title>Trovy story ads</title>
<style>
@font-face{font-family:Inter;font-weight:400;src:url(fonts/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/inter-latin-700-normal.woff2) format("woff2")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:375px;height:812px;overflow:hidden;background:#000;color:#fff;font-family:Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
/* status bar */
.sb{position:absolute;left:0;right:0;top:0;height:47px;display:flex;align-items:center;justify-content:space-between;padding:4px 26px 0 36px;z-index:5}
.sb b{font:600 16px/1 Inter,sans-serif;letter-spacing:-.2px}
.sb svg{display:block}
/* the deck of stories: each sponsored story is its own "account", so they turn like a cube between them */
.deck{position:absolute;left:0;top:47px;width:375px;height:667px;perspective:900px;perspective-origin:50% 50%}
.story{position:absolute;inset:0;border-radius:10px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;visibility:hidden;background:#000}
.story.on{visibility:visible}
.ad{position:absolute;left:0;top:0;width:1080px;height:1920px;transform:scale(.347222);transform-origin:0 0}
.ad img{position:absolute;display:block;max-width:none;will-change:transform,opacity}
.shade{position:absolute;left:0;right:0;top:0;height:120px;background:linear-gradient(rgba(0,0,0,.32),rgba(0,0,0,0));pointer-events:none}
.dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
/* Instagram story chrome */
.bar{position:absolute;left:8px;right:8px;top:8px;height:2px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:#fff;transform-origin:0 50%;transform:scaleX(0)}
.hd{position:absolute;left:12px;right:8px;top:20px;display:flex;align-items:center;gap:9px}
.hd img{width:32px;height:32px;border-radius:50%;display:block}
.hd .who{flex:1;line-height:1.15;text-shadow:0 0 6px rgba(0,0,0,.25)}
.hd .who b{display:block;font:600 14px/1.2 Inter,sans-serif}
.hd .who span{display:block;font:400 12px/1.25 Inter,sans-serif;opacity:.92}
.hd svg{display:block;flex:none}
/* below the story: the ad's call to action */
.cta{position:absolute;left:16px;right:16px;top:726px;height:44px;border-radius:22px;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;gap:6px;font:600 15px/1 Inter,sans-serif;z-index:4;text-decoration:none}
.home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#fff;z-index:4}
/* a finger, for the recording */
.touch{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.32);border:1.5px solid rgba(255,255,255,.8);box-shadow:0 2px 10px rgba(0,0,0,.25);opacity:0;z-index:9;pointer-events:none}
.hit{position:absolute;top:47px;height:667px;width:50%;z-index:6;cursor:pointer;background:none;border:0}
.hit--l{left:0}.hit--r{right:0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style></head>
<body>
<div class="sb" aria-hidden="true"><b>9:41</b>
  <svg width="77" height="13" viewBox="0 0 77 13" fill="#fff"><rect x="0" y="8" width="3.2" height="4.5" rx="1"/><rect x="4.8" y="6" width="3.2" height="6.5" rx="1"/><rect x="9.6" y="3.5" width="3.2" height="9" rx="1"/><rect x="14.4" y="1" width="3.2" height="11.5" rx="1"/><path d="M30.5 3.4a9.9 9.9 0 0 1 7 2.9l1.3-1.3a11.7 11.7 0 0 0-16.6 0l1.3 1.3a9.9 9.9 0 0 1 7-2.9zm0 3.6a6.2 6.2 0 0 1 4.4 1.8l1.3-1.3a8 8 0 0 0-11.4 0l1.3 1.3A6.2 6.2 0 0 1 30.5 7zm0 3.6a2.6 2.6 0 0 1 1.8.8l-1.8 1.8-1.8-1.8a2.6 2.6 0 0 1 1.8-.8z"/><rect x="48" y="1" width="24" height="11.5" rx="3.6" fill="none" stroke="#fff" stroke-opacity=".4"/><rect x="50" y="3" width="20" height="7.5" rx="2"/><rect x="73.5" y="4.6" width="1.6" height="4.2" rx=".8" fill-opacity=".45"/></svg>
</div>
<div class="deck" id="deck"></div>
<a class="cta" href="#" tabindex="-1" aria-label="Learn more">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11l6-6M6 5h5v5"/></svg>Learn more</a>
<div class="home" aria-hidden="true"></div>
<div class="touch" id="touch"></div>
<button class="hit hit--l" aria-label="Previous ad"></button><button class="hit hit--r" aria-label="Next ad"></button>
<p class="vh" aria-live="polite" id="live"></p>
<script src="ads.js"></script>
<script src="player.js"></script>
</body></html>
